services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corebot-production
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://corebot:corebot@postgres:5432/corebot?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - corebot-prod-network

  postgres:
    image: postgres:16-alpine
    container_name: corebot-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corebot}
      POSTGRES_DB: ${POSTGRES_DB:-corebot}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corebot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - corebot-prod-network

  redis:
    image: redis:7-alpine
    container_name: corebot-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - corebot-prod-network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  corebot-prod-network:
    driver: bridge
