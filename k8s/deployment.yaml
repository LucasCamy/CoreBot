apiVersion: apps/v1
kind: Deployment
metadata:
  name: corebot
  labels:
    app: corebot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: corebot
  template:
    metadata:
      labels:
        app: corebot
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: corebot
          image: ghcr.io/lucascamy/corebot:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: corebot-secrets
            - configMapRef:
                name: corebot-config
                optional: true
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: sound-assets
              mountPath: /app/assets/sounds
            - name: backup-data
              mountPath: /app/backups
      volumes:
        - name: sound-assets
          persistentVolumeClaim:
            claimName: corebot-sounds-pvc
        - name: backup-data
          persistentVolumeClaim:
            claimName: corebot-backups-pvc
