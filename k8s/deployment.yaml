apiVersion: apps/v1
kind: Deployment
metadata:
  name: corebot-app
  namespace: corebot
  labels:
    app: corebot-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: corebot-app
  template:
    metadata:
      labels:
        app: corebot-app
    spec:
      initContainers:
        - name: seed-sounds
          image: ghcr.io/lucascamy/corebot:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              mkdir -p /mnt/sounds
              if [ -d "/app/assets/sounds" ]; then
                cp -n -r /app/assets/sounds/* /mnt/sounds/ 2>/dev/null || true
              fi
          volumeMounts:
            - mountPath: /mnt/sounds
              name: sound-assets
      containers:
        - name: corebot
          image: ghcr.io/lucascamy/corebot:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: corebot-secrets
                  key: BOT_TOKEN
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: corebot-secrets
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_ALLOWED_GUILD_IDS
              valueFrom:
                secretKeyRef:
                  name: corebot-secrets
                  key: DISCORD_ALLOWED_GUILD_IDS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corebot-secrets
                  key: DATABASE_URL
            - name: REDIS_HOST
              value: "corebot-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: PORT
              value: "3000"
            - name: TIMEZONE
              value: "America/Sao_Paulo"
            - name: LOG_LEVEL
              value: "info"
            - name: ADMIN_DASHBOARD_USER
              valueFrom:
                secretKeyRef:
                  name: corebot-secrets
                  key: ADMIN_DASHBOARD_USER
            - name: ADMIN_DASHBOARD_PASS
              valueFrom:
                secretKeyRef:
                  name: corebot-secrets
                  key: ADMIN_DASHBOARD_PASS
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: corebot-secrets
                  key: WEBHOOK_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: sound-assets
              mountPath: /app/assets/sounds
            - name: backup-data
              mountPath: /app/backups
      volumes:
        - name: sound-assets
          persistentVolumeClaim:
            claimName: corebot-sounds-pvc
        - name: backup-data
          persistentVolumeClaim:
            claimName: corebot-backups-pvc
