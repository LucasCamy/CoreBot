name: CoreBot CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corebot
          POSTGRES_PASSWORD: corebot
          POSTGRES_DB: corebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Run Vitest Unit Tests
        run: npm run test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://corebot:corebot@localhost:5432/corebot_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          BOT_TOKEN: MTIzNDU2Nzg5MDEyMzQ1Njc4OQ.FakeTokenForCI.TestOnly
          DISCORD_CLIENT_ID: 123456789012345678
          DISCORD_ALLOWED_GUILD_IDS: 123456789012345678
          LOG_LEVEL: silent

      - name: Build TypeScript Project
        run: npm run build
