name: Deploy CoreBot

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/lucascamy/corebot:latest
            ghcr.io/lucascamy/corebot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar Kubeconfig
        if: ${{ secrets.KUBE_CONFIG != '' }}
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Atualizar Deployment no Kubernetes
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          kubectl set image deployment/corebot corebot=ghcr.io/lucascamy/corebot:${{ github.sha }}
          kubectl rollout status deployment/corebot --timeout=120s
